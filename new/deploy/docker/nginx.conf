worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  types_hash_max_size 4096;
  server_tokens off;
  reset_timedout_connection on;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_http_version 1.1;
  gzip_disable "msie6";
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream ribote_shiny_upstream {
    ip_hash;
    server ribote_app_1:3838;
    server ribote_app_2:3838;
    server ribote_app_3:3838;
  }

  server {
    listen 8080;
    server_name _;

    client_max_body_size 1g;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;

    location /react/app_shell/assets/ {
      alias /public/shiny/RiboTE/new/www/react/app_shell/assets/;
      access_log off;
      add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /react/ {
      alias /public/shiny/RiboTE/new/www/react/;
      access_log off;
      add_header Cache-Control "public, max-age=3600";
    }

    location /css/ {
      alias /public/shiny/RiboTE/new/www/css/;
      access_log off;
      add_header Cache-Control "public, max-age=3600";
    }

    location = /ribote-resources/logo.webp {
      alias /public/shiny/RiboTE/new/resources/logo.webp;
      access_log off;
      add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
      proxy_pass http://ribote_shiny_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_request_buffering off;
    }
  }
}
